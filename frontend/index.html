<!-- # ===== frontend/index.html ===== -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>COMTRADE Viewer</title>
  <link rel="stylesheet" href="style.css">
  <!-- <script src="https://cdn.plot.ly/plotly-latest.min.js"></script> -->
  <script src="plotly-latest.min.js"></script>
  <!-- <script src="plotly.js"></script> -->
</head>
<body>
  <div class="container">
    <h1>COMTRADE 文件</h1>

    <div class="row">
      <div class="col upload-section">
        <div class="input-group">
          <label for="cfgFile">选择 .cfg 文件：</label>
          <input type="file" id="cfgFile" accept=".cfg">
        </div>

        <div class="input-group">
          <label for="datFile">选择 .dat 文件：</label>
          <input type="file" id="datFile" accept=".dat">
        </div>

        <button onclick="uploadFiles()">上传</button>
      </div>

      <div id="metadata" class="col metadata-section" style="margin-top: 30px;">
        <h2>元信息</h2>
        <ul id="metadataList" style="list-style: none; padding-left: 0;"></ul>
      </div>
    </div>

    <!-- 暂时放置在这里  -->
    <div id="channelSelector">
      <h3>选择通道</h3>
      <button onclick="selectAllChannels(true)">全选</button>
      <button onclick="selectAllChannels(false)">全不选</button>
      <div id="channelList"></div>
      <button onclick="applySelection()">应用选择</button>
    </div>


    

    <div id="plots" style="margin-top: 50px;"></div>
    
    <div id="controlPanel">
      <button onclick="resetZoom()">重置缩放</button>
    </div>

  </div>

  <script src="main.js"></script>
</body>

</html>
