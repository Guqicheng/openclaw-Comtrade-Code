<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMTRADE Viewer</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== 顶部工具栏 ===== -->
  <div id="topBar">
    <div class="toolbar-left">
      <button id="toggleSidebar" title="切换侧边栏">☰</button>
      <span class="toolbar-title">COMTRADE Viewer</span>
    </div>
    <div class="toolbar-center">
      <div class="zoom-controls">
        <button onclick="zoomOut()" title="缩小">−</button>
        <button onclick="resetZoom()" title="恢复全时段显示">重置</button>
        <button onclick="zoomIn()" title="放大">+</button>
        <button type="button" id="btnTogglePan" title="平移模式：拖动波形；默认框选放大">平移</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="view-tools">
        <button id="btnToggleTrigger" title="显示/隐藏触发点标注">触发点</button>
        <button id="btnToggleOverlay" title="将多个模拟通道叠加到同一子图">叠加</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="export-tools">
        <button id="btnExportPng" title="导出当前波形视图为 PNG">导出 PNG</button>
        <button id="btnExportCsv" title="导出当前已选通道为 CSV">导出 CSV</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="page-size-selector">
        <button id="pageSizeBtn" onclick="togglePageSizeMenu()">每页 5 子图 ▾</button>
        <ul id="pageSizeMenu" class="hidden">
          <li data-size="3">3 子图</li>
          <li data-size="4">4 子图</li>
          <li data-size="5">5 子图</li>
        </ul>
      </div>
      <div class="toolbar-divider"></div>
      <div class="cursor-tools">
        <button id="dualCursorBtn">双光标</button>
      </div>
    </div>
  </div>

  <!-- ===== 主体区域 ===== -->
  <div id="mainBody">

    <!-- 左侧边栏 -->
    <div id="sidebar">
      <!-- 上传 -->
      <div class="sidebar-section">
        <div class="section-header" onclick="togglePanel(this)">
          <span>上传文件</span>
          <span class="arrow">▼</span>
        </div>
        <div class="section-body">
          <div class="upload-row">
            <input type="file" id="cfgFile" accept=".cfg" class="file-input">
            <label for="cfgFile" class="file-label">.CFG</label>
          </div>
          <div class="upload-row">
            <input type="file" id="datFile" accept=".dat" class="file-input">
            <label for="datFile" class="file-label">.DAT</label>
          </div>
          <button onclick="uploadFiles()" class="upload-btn">上传并解析</button>
        </div>
      </div>

      <!-- 元信息 -->
      <div class="sidebar-section collapsed">
        <div class="section-header" onclick="togglePanel(this)">
          <span>元信息</span>
          <span class="arrow">▼</span>
        </div>
        <div class="section-body" id="metadata">
          <span class="hint-text">上传文件后显示</span>
        </div>
      </div>

      <!-- 通道选择（默认展开） -->
      <div class="sidebar-section">
        <div class="section-header" onclick="togglePanel(this)">
          <span>通道选择</span>
          <span class="arrow">▼</span>
        </div>
        <div class="section-body">
          <input type="text" id="channelSearch" placeholder="搜索通道..." class="search-input">
          <div class="ch-group">
            <div class="ch-group-header" role="button" tabindex="0" onclick="toggleChGroup(event)" onkeydown="chGroupHeaderKeydown(event)">
              <span>模拟通道</span>
              <span class="badge" id="analogCount">0</span>
              <span class="arrow">▼</span>
            </div>
            <div class="ch-action-bar">
              <button onclick="selectAnalogAll(true)">全选</button>
              <button onclick="selectAnalogAll(false)">清空</button>
              <button onclick="applyAnalog()" class="btn-primary">应用</button>
            </div>
            <div class="ch-group-body" id="analogChannelList"></div>
          </div>
          <div class="ch-group collapsed">
            <div class="ch-group-header" role="button" tabindex="0" onclick="toggleChGroup(event)" onkeydown="chGroupHeaderKeydown(event)">
              <span>数字通道</span>
              <span class="badge" id="digitalCount">0</span>
              <span class="arrow">▼</span>
            </div>
            <div class="ch-action-bar ch-action-bar-wrap">
              <button onclick="selectDigitalAll(true)">全选</button>
              <button onclick="selectDigitalAll(false)">清空</button>
              <button type="button" id="btnHideStaticDigital" title="波形区不显示全程无变位的开关量">隐藏无变位</button>
              <button onclick="applyDigital()" class="btn-primary">应用</button>
            </div>
            <div class="ch-group-body" id="digitalChannelList"></div>
          </div>
        </div>
      </div>

      <!-- 测量工具 -->
      <div class="sidebar-section">
        <div class="section-header" onclick="togglePanel(this)">
          <span>测量工具</span>
          <span class="arrow">▼</span>
        </div>
        <div class="section-body">
          <!-- RMS -->
          <div class="tool-row">
            <select id="rmsChannelSelect" class="tool-select"></select>
            <button onclick="calculateChannelRMS(document.getElementById('rmsChannelSelect').value)" class="tool-btn">RMS</button>
          </div>
          <!-- 峰值 -->
          <div class="tool-row">
            <select id="peakChannelSelect" class="tool-select"></select>
            <button onclick="detectChannelPeaks(document.getElementById('peakChannelSelect').value)" class="tool-btn">峰谷检测</button>
          </div>
          <!-- FFT -->
          <div class="tool-row">
            <select id="fftChannelSelect" class="tool-select"></select>
            <button onclick="performFFTAnalysis(document.getElementById('fftChannelSelect').value)" class="tool-btn">FFT</button>
          </div>
          <!-- 相角差 -->
          <div class="tool-row">
            <select id="phaseDiffChannelA" class="tool-select" style="width:48%"></select>
            <select id="phaseDiffChannelB" class="tool-select" style="width:48%"></select>
            <button onclick="calculatePhaseDiff(
              document.getElementById('phaseDiffChannelA').value,
              document.getElementById('phaseDiffChannelB').value
            )" class="tool-btn" style="width:100%;margin-top:3px">相角差</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧波形区 -->
    <div id="content">
      <div id="plots">
        <div class="placeholder">
          <div class="placeholder-icon">📊</div>
          <div class="placeholder-text">上传 .cfg + .dat 文件开始分析</div>
          <div class="placeholder-sub">支持 COMTRADE 1991 / 1999 / 2013 格式</div>
        </div>
      </div>
      <div id="timeNavBar" class="time-nav-bar hidden">
        <span class="time-nav-label">时间轴</span>
        <input type="range" id="timeNavSlider" min="0" max="1" step="0.001" value="0" title="拖动浏览放大后的整段录波" />
        <span id="timeNavHint" class="time-nav-hint"></span>
      </div>
    </div>

  </div>

  <!-- ===== 底部状态栏 ===== -->
  <div id="statusBar">
    <span id="statusFile">未加载文件</span>
    <span class="status-divider">|</span>
    <span id="statusCursor">光标: —</span>
    <span class="status-divider">|</span>
    <span id="statusInfo">就绪</span>
  </div>
</div>

<!-- 遮罩层 -->
<div id="sidebarOverlay"></div>

<!-- 浮动结果面板 -->
<div id="floatingResults">
  <div class="floating-header">
    <span id="floatingTitle">分析结果</span>
    <button class="floating-close" onclick="closeFloatingResults()">×</button>
  </div>
  <div class="floating-body" id="floatingBody"></div>
</div>

<!-- FFT 模态框 -->
<div id="fftModal" class="modal-overlay" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3>频谱分析</h3>
      <button id="fftModalClose" class="modal-close">×</button>
    </div>
    <div id="fftPlot" class="modal-plot"></div>
    <div id="fftHarmonics" class="modal-harmonics"></div>
  </div>
</div>

<script src="channelControls.js"></script>
<script src="main.js"></script>
<script src="measurementTools.js"></script>

<script>
  /** 模拟通道 / 数字通道：只收起本分组（列表 + 全选/应用栏） */
  function toggleChGroup(e) {
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    const header = e ? e.currentTarget : null;
    if (!header) return;
    const group = header.closest(".ch-group");
    if (group) group.classList.toggle("collapsed");
  }

  function chGroupHeaderKeydown(e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggleChGroup(e);
    }
  }

  function togglePanel(header) {
    if (!header || header.classList.contains("ch-group-header")) return;
    const section = header.closest(".sidebar-section");
    if (section) section.classList.toggle("collapsed");
  }
</script>

</body>
</html>
